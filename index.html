<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4338ca">
<title>Nilai Tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f4fb;
    --kartu: #ffffff;
    --ink: #151a2d;
    --ink-2: #6a7590;
    --garis: #e6e9f4;
    --utama: #4f46e5;
    --utama-2: #7c3aed;
    --utama-lembut: #eef0ff;
    --hadir: #0f9d76;
    --hadir-lembut: #e6f7f1;
    --alpa: #e11d48;
    --alpa-lembut: #fdeef1;
    --radius: 18px;
    --bayang: 0 1px 2px rgba(21, 26, 45, .04), 0 8px 24px -12px rgba(21, 26, 45, .16);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0f17; --kartu: #151a24; --ink: #eaeefb; --ink-2: #99a3bd; --garis: #252b38;
      --utama: #8b85ff; --utama-2: #b98cff; --utama-lembut: #1c1f38;
      --hadir: #34d3a4; --hadir-lembut: #10241e; --alpa: #fb7185; --alpa-lembut: #2a141c;
      --bayang: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .8);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 inherit; padding-bottom: env(safe-area-inset-bottom);
  }
  .bungkus { max-width: 42rem; margin: 0 auto; padding: 0 16px 56px; }

  /* ------------------------------------------------------ layar masuk */
  .masuk { min-height: 100svh; display: grid; align-content: center; gap: 22px; padding: 32px 0; }
  .lambang {
    width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
    background: linear-gradient(140deg, var(--utama), var(--utama-2));
    color: #fff; font-size: 24px; font-weight: 800;
  }
  .masuk h1 { font-size: clamp(27px, 7vw, 36px); line-height: 1.15; font-weight: 800; margin: 0; letter-spacing: -.02em; }
  .masuk .sub { color: var(--ink-2); font-size: 15px; margin: 10px 0 0; max-width: 30rem; }
  .panel { background: var(--kartu); border-radius: var(--radius); box-shadow: var(--bayang); padding: 20px; }
  .isian + .isian { margin-top: 14px; }
  label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; }
  input {
    width: 100%; font: 500 16px/1.4 inherit; color: var(--ink); background: var(--bg);
    border: 1.5px solid var(--garis); border-radius: 12px; padding: 14px 15px; min-height: 52px;
  }
  #nim { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  input::placeholder { color: var(--ink-2); opacity: .7; }
  input:focus { outline: none; border-color: var(--utama); background: var(--kartu); }
  .tombol {
    width: 100%; min-height: 54px; margin-top: 18px; border: 0; border-radius: 13px; cursor: pointer;
    font: 700 16px inherit; color: #fff; background: linear-gradient(135deg, var(--utama), var(--utama-2));
  }
  .tombol:active { transform: translateY(1px); }
  .tombol[disabled] { opacity: .65; cursor: progress; }
  .bantu { color: var(--ink-2); font-size: 13.5px; margin: 14px 2px 0; }
  .salah {
    margin-top: 14px; padding: 13px 15px; border-radius: 12px;
    background: var(--alpa-lembut); color: var(--alpa); font-size: 14.5px; font-weight: 500;
  }

  /* ------------------------------------------------------ hasil */
  .atas {
    position: sticky; top: 0; z-index: 5; margin: 0 -16px 18px; padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
    background: linear-gradient(135deg, var(--utama), var(--utama-2)); color: #fff;
    display: flex; gap: 14px; align-items: center; justify-content: space-between;
  }
  .atas h2 { font-size: 17px; font-weight: 700; margin: 0; line-height: 1.25; }
  .atas p { margin: 3px 0 0; font-size: 13px; opacity: .82; font-variant-numeric: tabular-nums; }
  .keluar {
    flex: none; background: rgba(255, 255, 255, .18); color: #fff; border: 0; border-radius: 10px;
    font: 600 13.5px inherit; padding: 10px 13px; min-height: 40px; cursor: pointer;
  }
  .keluar:hover { background: rgba(255, 255, 255, .28); }

  .mk { background: var(--kartu); border-radius: var(--radius); box-shadow: var(--bayang); padding: 18px; margin-bottom: 16px; }
  .mk-atas { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
  .mk h3 { font-size: 16.5px; font-weight: 700; margin: 0; line-height: 1.35; }
  .mk .kode { color: var(--ink-2); font-size: 13px; margin: 4px 0 0; }
  .nt { flex: none; text-align: center; background: var(--utama-lembut); border-radius: 14px; padding: 10px 14px; min-width: 84px; }
  .nt .angka { display: block; font-size: 26px; min-height: 26px; font-weight: 800; line-height: 1; color: var(--utama); font-variant-numeric: tabular-nums; }
  .nt .teks { display: block; font-size: 11px; font-weight: 600; color: var(--ink-2); margin-top: 5px; }

  .meter { margin: 16px 0 6px; }
  .meter .baris1 { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; margin-bottom: 8px; }
  .meter b { font-weight: 700; }
  .meter .kecil { color: var(--ink-2); font-size: 13px; }
  .rel { height: 8px; border-radius: 99px; background: var(--garis); overflow: hidden; }
  .rel i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--hadir), #4bd4ac); }

  .hari { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  @media (min-width: 30rem) { .hari { grid-template-columns: repeat(8, 1fr); } }
  .h { border-radius: 12px; padding: 10px 4px 11px; text-align: center; background: var(--bg); border: 1.5px solid transparent; }
  .h.ya { background: var(--hadir-lembut); border-color: color-mix(in srgb, var(--hadir) 28%, transparent); }
  .h .n { display: block; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .h.ya .n { color: var(--hadir); }
  .h.tidak .n { color: var(--ink-2); }
  .h .tgl { display: block; font-size: 11px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; }
  .h .ikon { display: block; font-size: 13px; margin-top: 5px; line-height: 1; }
  .h.ya .ikon { color: var(--hadir); }
  .h.tidak .ikon { color: var(--ink-2); opacity: .5; }

  details { margin-top: 14px; }
  details summary {
    list-style: none; cursor: pointer; color: var(--utama); font-size: 13.5px; font-weight: 600;
    padding: 8px 0; min-height: 40px; display: flex; align-items: center; gap: 6px;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "▾"; font-size: 12px; transition: transform .15s; }
  details[open] summary::after { transform: rotate(180deg); }
  .materi { margin: 4px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-2); }
  .materi li { display: flex; gap: 9px; padding: 6px 0; border-top: 1px solid var(--garis); }
  .materi b { flex: none; width: 1.3rem; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

  .nilai { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--garis); }
  .judul-kecil { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 0 0 10px; }
  .ubin { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 30rem) { .ubin { grid-template-columns: repeat(4, 1fr); } }
  .u { background: var(--bg); border-radius: 13px; padding: 12px 12px 11px; }
  .u .v { font-size: 21px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .u.kosong .v { color: var(--ink-2); font-weight: 600; }
  .u .k { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .u .d { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }
  .u .mini { margin-top: 9px; }
  .mini { height: 5px; border-radius: 99px; background: var(--garis); overflow: hidden; }
  .mini i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--utama), var(--utama-2)); }
  .u.kosong .mini { opacity: .45; }

  .hitung {
    margin-top: 10px; background: var(--utama-lembut); border-radius: 13px;
    padding: 13px 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  }
  .hitung .bagian { display: flex; align-items: baseline; gap: 7px; }
  .hitung .angka { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hitung .nama { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
  .hitung .akhir .angka { color: var(--utama); font-size: 22px; }
  .hitung .panah { color: var(--ink-2); font-size: 13px; }

  .catatan { font-size: 12.5px; color: var(--ink-2); margin: 14px 2px 0; }
  .kaki { text-align: center; font-size: 12.5px; color: var(--ink-2); margin: 22px 0 0; }
  .sembunyi { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- layar 1: masuk -->
<section id="layarMasuk" class="bungkus">
  <div class="masuk">
    <div>
      <div class="lambang">N</div>
      <h1 style="margin-top:18px">Nilai &amp; kehadiran tutorial Anda</h1>
      <p class="sub">Masukkan NIM untuk melihat daftar hadir dan nilai tutorial tatap muka semester ini.</p>
    </div>

    <form id="f" class="panel" autocomplete="off">
      <div class="isian">
        <label for="nim">NIM</label>
        <input id="nim" inputmode="numeric" placeholder="858988947" required>
      </div>
      <div class="isian sembunyi" id="bungkusKunci">
        <label for="kunci">Kata kunci kelas</label>
        <input id="kunci" type="password" placeholder="dari tutor Anda">
      </div>
      <button class="tombol" id="btn">Lihat nilai saya</button>
      <div id="pesan"></div>
      <p class="bantu" id="bantu">Kata kunci kelas diberitahukan tutor saat tutorial.</p>
    </form>
  </div>
</section>

<!-- layar 2: hasil -->
<section id="layarHasil" class="bungkus sembunyi">
  <header class="atas">
    <div><h2 id="namaMhs"></h2><p id="nimMhs"></p></div>
    <button class="keluar" id="btnKeluar">Ganti NIM</button>
  </header>
  <div id="daftarMK"></div>
  <p class="kaki" id="kaki"></p>
</section>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const angka = v => (v === null || v === undefined) ? "–" : Number(v).toLocaleString("id-ID", { maximumFractionDigits: 1 });
const BULAN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const tglPendek = t => { const d = new Date(t + "T00:00:00"); return isNaN(d) ? "" : d.getDate() + " " + BULAN[d.getMonth()]; };
const simpan = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const ambil = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };

let berkas = null;
async function muat() {
  if (berkas) return berkas;
  const r = await fetch("nilai.json?" + Date.now());
  if (!r.ok) throw new Error("Nilai belum diterbitkan tutor. Coba lagi nanti.");
  berkas = await r.json();
  if (berkas.kunci_kelas) $("#bungkusKunci").classList.remove("sembunyi");
  else $("#bantu").textContent = "Cukup NIM, tanpa kata kunci.";
  return berkas;
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function buka(d, nim, kataKunci) {
  const bahan = await crypto.subtle.importKey("raw", new TextEncoder().encode(nim + ":" + kataKunci),
                                              "PBKDF2", false, ["deriveBits"]);
  const dk = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64(d.salt), iterations: d.iter, hash: "SHA-256" }, bahan, 384));
  const blok = d.rec[[...dk.slice(0, 16)].map(b => b.toString(16).padStart(2, "0")).join("")];
  if (!blok) return null;
  const buf = b64(blok);
  const kunci = await crypto.subtle.importKey("raw", dk.slice(16), "AES-GCM", false, ["decrypt"]);
  const isi = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, kunci, buf.slice(12));
  return JSON.parse(new TextDecoder().decode(isi));
}

function ubin(kode, ket, nilai) {
  const ada = nilai !== null && nilai !== undefined;
  return `<div class="u ${ada ? "" : "kosong"}">
    <div class="v">${angka(nilai)}</div>
    <div class="k">${kode}</div>
    <div class="d">${ket}</div>
    <div class="mini"><i style="width:${ada ? Math.max(0, Math.min(100, nilai)) : 0}%"></i></div>
  </div>`;
}

function kartuMK(mk) {
  const p = mk.pertemuan, hadir = p.filter(x => x.hadir).length;
  const tanya = p.reduce((a, x) => a + (x.aktif || 0), 0);
  const adaNT = mk.nilai.nt !== null && mk.nilai.nt !== undefined;
  return `<article class="mk">
    <div class="mk-atas">
      <div>
        <h3>${esc(mk.nama_mk)}</h3>
        <p class="kode">${esc(mk.kode)}${mk.pokjar ? ", pokjar " + esc(mk.pokjar) : ""}</p>
      </div>
      <div class="nt">
        <span class="angka">${adaNT ? angka(mk.nilai.nt) : "–"}</span>
        <span class="teks">${adaNT ? "nilai tutorial" : "belum lengkap"}</span>
      </div>
    </div>

    <div class="meter">
      <div class="baris1">
        <span>Kehadiran <b>${hadir} dari ${p.length}</b></span>
        ${tanya ? `<span class="kecil">${tanya}× bertanya di kelas</span>` : ""}
      </div>
      <div class="rel"><i style="width:${hadir / p.length * 100}%"></i></div>
    </div>

    <div class="hari">${p.map(x => `
      <div class="h ${x.hadir ? "ya" : "tidak"}">
        <span class="n">${x.n}</span>
        <span class="tgl">${esc(tglPendek(x.tanggal) || "—")}</span>
        <span class="ikon">${x.hadir ? "✓" : "·"}</span>
      </div>`).join("")}</div>

    ${p.some(x => x.materi) ? `<details>
      <summary>Materi tiap pertemuan</summary>
      <ul class="materi">${p.filter(x => x.materi).map(x =>
        `<li><b>${x.n}</b><span>${esc(x.materi)}</span></li>`).join("")}</ul>
    </details>` : ""}

    <div class="nilai">
      <p class="judul-kecil">Nilai partisipasi</p>
      <div class="ubin">
        ${ubin("NH", "kehadiran", mk.nilai.nh)}
        ${ubin("NA", "keaktifan", mk.na)}
        ${ubin("NTP", "tugas partisipasi", mk.ntp)}
        ${ubin("NP", "gabungan tiga di kiri", mk.nilai.np)}
      </div>

      <p class="judul-kecil" style="margin-top:16px">Tugas tutorial</p>
      <div class="ubin">
        ${mk.tugas.map((t, i) => ubin("Tugas " + (i + 1), "nilai tugas", t)).join("")}
        ${ubin("NTT", "rata-rata tugas", mk.nilai.ntt)}
      </div>

      <div class="hitung">
        <span class="bagian"><span class="nama">NP</span><span class="angka">${angka(mk.nilai.np)}</span></span>
        <span class="bagian"><span class="nama">NTT</span><span class="angka">${angka(mk.nilai.ntt)}</span></span>
        <span class="panah">menghasilkan</span>
        <span class="bagian akhir"><span class="nama">nilai tutorial</span><span class="angka">${angka(mk.nilai.nt)}</span></span>
      </div>
    </div>
    <p class="catatan">Nilai tutorial = (3 × NP + 7 × NTT) : 10. Tanda – berarti tutor belum mengisinya.</p>
  </article>`;
}

function tampilkan(m, d) {
  $("#namaMhs").textContent = m.nama;
  $("#nimMhs").textContent = "NIM " + m.nim + (m.tutor ? " · " + m.tutor : "");
  $("#daftarMK").innerHTML = m.mk.map(kartuMK).join("");
  $("#kaki").textContent = d.diperbarui
    ? "Diperbarui tutor " + new Date(d.diperbarui).toLocaleString("id-ID", { dateStyle: "long", timeStyle: "short" })
    : "";
  $("#layarMasuk").classList.add("sembunyi");
  $("#layarHasil").classList.remove("sembunyi");
  window.scrollTo(0, 0);
}

async function lihat(nim, kataKunci, dariIngatan = false) {
  $("#pesan").innerHTML = "";
  $("#btn").disabled = true; $("#btn").textContent = "Membuka…";
  try {
    const d = await muat();
    if (d.kunci_kelas && !kataKunci) throw new Error("Isi juga kata kunci kelas dari tutor Anda.");
    const m = await buka(d, nim, kataKunci);
    if (!m) throw new Error(d.kunci_kelas
      ? "NIM atau kata kunci belum cocok. Periksa lagi, atau tanyakan ke tutor Anda."
      : "NIM itu tidak ada dalam daftar. Periksa lagi, atau tanyakan ke tutor Anda.");
    simpan("nim", nim); simpan("kunci", kataKunci);
    tampilkan(m, d);
  } catch (err) {
    if (!dariIngatan) $("#pesan").innerHTML = `<p class="salah">${esc(err.message)}</p>`;
  } finally {
    $("#btn").disabled = false; $("#btn").textContent = "Lihat nilai saya";
  }
}

$("#f").onsubmit = e => {
  e.preventDefault();
  lihat($("#nim").value.replace(/\D+/g, ""), $("#kunci").value);
};

$("#btnKeluar").onclick = () => {
  simpan("nim", ""); simpan("kunci", "");
  $("#layarHasil").classList.add("sembunyi");
  $("#layarMasuk").classList.remove("sembunyi");
  $("#nim").value = ""; $("#kunci").value = ""; $("#nim").focus();
};

// buka otomatis kalau perangkat ini sudah pernah dipakai
muat().then(d => {
  const nim = ambil("nim");
  if (!nim) return;
  $("#nim").value = nim; $("#kunci").value = ambil("kunci");
  lihat(nim, ambil("kunci"), true);
}).catch(() => {});
</script>
</body>
</html>
